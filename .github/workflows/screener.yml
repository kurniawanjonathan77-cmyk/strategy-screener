name: Strategy Screener

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:  # Manual trigger
  push:
    branches: [main]
    paths:
      - 'config.yaml'
      - 'src/**'
      - 'requirements.txt'

permissions:
  contents: write  # Needed to push to gh-pages
  pages: write
  id-token: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Install TA-Lib (optional, fallback to pandas-ta)
          sudo apt-get update && sudo apt-get install -y ta-lib 2>/dev/null || true
      
      - name: Create directories
        run: |
          mkdir -p logs data/cache docs
      
      - name: Run Strategy Screener
        run: |
          python run.py
        env:
          PYTHONPATH: ${{ github.workspace }}
      
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet docs/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push dashboard
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "📊 Update dashboard - $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"

  # Optional: Run backtest on schedule (less frequent)
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: screen
    if: github.event_name == 'schedule' && github.event.schedule == '0 0 * * 0'  # Weekly on Sunday
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install deps
        run: pip install -r requirements.txt
      
      - name: Run Extended Backtest
        run: |
          python -c "
          from src.screener import StrategyScreener
          import asyncio
          screener = StrategyScreener()
          asyncio.run(screener.run_screening())
          "
        env:
          PYTHONPATH: ${{ github.workspace }}